<!DOCTYPE html>
<html lang="en">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FLEXDIRECTION</title>
<style>
    .contenedor-direction{
        display: flex;

<body>
    <div class="contenedor-direction">
        <div class="item">1</div>
        <div class="item">2</div>
        <div class="item">3</div>
      </div>

</html>
